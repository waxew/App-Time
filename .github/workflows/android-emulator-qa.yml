# QA نصب و اجرای واقعی App-Time روی شبیه‌ساز Android 15.
name: App-Time Emulator QA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-emulator-qa.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and inspect app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail

            # از ابتدای تست شواهد متنی ایجاد می‌شوند تا حتی در خطا قابل بررسی باشند.
            adb devices | tee adb-devices.txt

            # نصب باید صریحاً با Success تمام شود.
            adb install -r app/build/outputs/apk/debug/app-debug.apk | tee install-result.txt
            grep -q '^Success' install-result.txt

            # Activity اصلی باید توسط Package Manager قابل Resolve باشد.
            adb shell cmd package resolve-activity --brief ir.asteam.apptime | tr -d '\r' | tee resolved-activity.txt
            grep -q 'ir.asteam.apptime/.MainActivity' resolved-activity.txt

            # Crash buffer قبل از Launch پاک می‌شود تا فقط خطاهای همین اجرا سنجیده شوند.
            adb logcat -c

            # Launch با -W منتظر اولین Window می‌ماند؛ Status باید ok باشد.
            adb shell am start -W -n ir.asteam.apptime/.MainActivity | tr -d '\r' | tee launch-result.txt
            grep -q '^Status: ok' launch-result.txt

            # چند ثانیه فرصت می‌دهیم Compose اولین Frame را بسازد.
            sleep 5

            # Process باید بعد از ساخت UI همچنان زنده باشد.
            pid="$(adb shell pidof -s ir.asteam.apptime | tr -d '\r')"
            test -n "$pid"
            echo "$pid" | tee process-id.txt

            # وضعیت Activity برای اثبات قرارگرفتن MainActivity در Task ذخیره می‌شود.
            adb shell dumpsys activity activities | tr -d '\r' > activity-state.txt
            grep -q 'ir.asteam.apptime/.MainActivity' activity-state.txt

            # Crash Buffer نباید Crash متعلق به App-Time داشته باشد.
            adb logcat -d -b crash | tr -d '\r' > crash-log.txt || true
            if grep -q 'ir.asteam.apptime' crash-log.txt; then
              cat crash-log.txt
              exit 1
            fi

            # در پایان Uninstall نیز باید موفق باشد تا چرخه نصب کامل تأیید شود.
            adb shell am force-stop ir.asteam.apptime
            adb uninstall ir.asteam.apptime | tee uninstall-result.txt
            grep -q '^Success' uninstall-result.txt

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v2.0.0-emulator-qa
          path: |
            adb-devices.txt
            install-result.txt
            resolved-activity.txt
            launch-result.txt
            process-id.txt
            activity-state.txt
            crash-log.txt
            uninstall-result.txt
          if-no-files-found: warn
          retention-days: 14
