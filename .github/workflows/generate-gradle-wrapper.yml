# Gradle Wrapper 8.9 برای Build محلی در Android Studio و VS Code.
name: Generate Gradle Wrapper

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate-gradle-wrapper.yml'

jobs:
  wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Commit wrapper
        run: |
          set -euo pipefail
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "build: add Gradle 8.9 wrapper"
          git push
