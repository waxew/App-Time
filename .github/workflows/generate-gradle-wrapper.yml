# Gradle Wrapper 8.9 برای Build محلی در Android Studio و VS Code.
name: Generate Gradle Wrapper

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/generate-gradle-wrapper.yml'

jobs:
  wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Commit wrapper if changed
        run: |
          set -euo pipefail
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh Gradle 8.9 wrapper"
            git push
          fi

      - name: Package current public source
        run: |
          zip -r App-Time-v2.0.0-source-current.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'build/*' \
            -x 'app/build/*' \
            -x 'signing/*' \
            -x '*.jks' \
            -x '*.keystore'

      - name: Upload current public source
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v2.0.0-source-current
          path: App-Time-v2.0.0-source-current.zip
          if-no-files-found: error
          retention-days: 30
