# خط CI اصلی App-Time؛ هر Push روی main را Compile، Lint و بسته‌بندی می‌کند.
name: App-Time Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # سورس همان Commit را به‌صورت کامل دریافت می‌کنیم تا در صورت وجود Hotfix کوچک، آن را روی main ثبت کنیم.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Kotlin Collection حاصل از SortedMap.values مستقیماً takeLast ندارد.
      # این اصلاح یک‌باره روی سورس v2 اعمال می‌شود و سپس در Repository ثبت می‌گردد.
      - name: Apply v2 compile normalization
        run: |
          set -euo pipefail
          FILE="app/src/main/java/ir/asteam/apptime/MainActivity.kt"
          if grep -q 'toSortedMap().values.takeLast(12)' "$FILE"; then
            sed -i 's/toSortedMap()\.values\.takeLast(12)/toSortedMap().values.toList().takeLast(12)/' "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "fix: normalize dashboard chart collection"
            git push
          fi

      # پروژه با Java 17 سازگار و تست شده است.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK و ابزارهای خط فرمان را روی Runner آماده می‌کنیم.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk/targetSdk پروژه 35 است و Build Tools 35 برای APK و apksigner نصب می‌شود.
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ابزار رسمی امضا را بدون هیچ Keystore یا رمز خصوصی به‌عنوان Artifact کمکی نگهداری می‌کنیم.
      # این فایل‌ها مستقیماً از Android SDK نصب‌شده در Runner تهیه می‌شوند.
      - name: Package official Android signing tools
        run: |
          mkdir -p android-signing-tools-35/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-signing-tools-35/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-signing-tools-35/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools-35/lib/apksigner.jar
          chmod +x android-signing-tools-35/apksigner android-signing-tools-35/zipalign

      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: android-signing-tools-35
          if-no-files-found: error
          retention-days: 7

      # Gradle 8.9 برای Build این پروژه استفاده می‌شود.
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # هر دو Variant ساخته می‌شوند تا خطاهای مختص Debug یا Release پنهان نمانند.
      - name: Compile Debug and Release
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # Lint بعد از Compile اجرا می‌شود و خطاهای Android/Kotlin را کنترل می‌کند.
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      # نام فایل‌های قابل تحویل ثابت و قابل تشخیص است؛ Release این مرحله عمداً unsigned است.
      - name: Prepare build artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk App-Time-v2.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk App-Time-v2.0.0-release-unsigned.apk
          sha256sum App-Time-v2.0.0-debug.apk App-Time-v2.0.0-release-unsigned.apk > App-Time-v2.0.0-build.sha256
          zip -r App-Time-v2.0.0-source-public.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'build/*' \
            -x 'app/build/*' \
            -x 'signing/*' \
            -x '*.jks' \
            -x '*.keystore' \
            -x 'App-Time-v2.0.0-debug.apk' \
            -x 'App-Time-v2.0.0-release-unsigned.apk' \
            -x 'android-signing-tools-35/*'

      # Debug برای QA سریع روی دستگاه/شبیه‌ساز نگهداری می‌شود.
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v2.0.0-debug
          path: App-Time-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Release بدون کلید خصوصی در CI عمومی تولید می‌شود و بعداً با Keystore پایدار مالک امضا می‌گردد.
      - name: Upload unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v2.0.0-release-unsigned
          path: App-Time-v2.0.0-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      # سورس عمومی بدون Keystore، Cache و Build output تحویل داده می‌شود.
      - name: Upload public source
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v2.0.0-source-public
          path: App-Time-v2.0.0-source-public.zip
          if-no-files-found: error
          retention-days: 30

      # Checksum خروجی‌های CI برای کنترل سلامت فایل‌ها نگهداری می‌شود.
      - name: Upload build checksums
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v2.0.0-checksums
          path: App-Time-v2.0.0-build.sha256
          if-no-files-found: error
          retention-days: 30
