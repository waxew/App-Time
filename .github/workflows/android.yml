name: Android Installable APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Android Gradle Plugin خروجی Debug را با کلید استاندارد Debug امضا می‌کند.
      - name: Build signed installable APK
        run: gradle :app:assembleDebug --stacktrace

      # نام فایل تحویلی ساده و مشخص نگه داشته می‌شود.
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk App-Time-v1.1.0-installable.apk

      # فایل ساخته‌شده برای بررسی و نصب آپلود می‌شود.
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Time-v1.1.0-installable
          path: App-Time-v1.1.0-installable.apk
          if-no-files-found: error
          retention-days: 30
